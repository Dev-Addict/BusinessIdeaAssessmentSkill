name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and skill
        run: python3 skills/business-idea-assessment/scripts/validate_repository.py .
      - name: Exercise assessment validator
        run: python3 skills/business-idea-assessment/scripts/validate_assessment.py --self-test

