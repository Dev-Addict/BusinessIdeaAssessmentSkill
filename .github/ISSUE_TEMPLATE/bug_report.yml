name: Bug report
description: Report incorrect, unsafe, or inconsistent skill behaviour
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: request
    attributes:
      label: User request or scenario
      description: Remove private, personal, and confidential information.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected decision or behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version or commit
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Relevant validation output

